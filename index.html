<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数智工厂</title>
<style>
:root { --cyan:#00e5ff; --text:#e9f7ff; --muted:#8aa9be; }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { display:flex; flex-direction:column; color:var(--text); background:#030a14;
  font:14px "Microsoft YaHei",Arial,sans-serif; }
.topbar { display:flex; align-items:center; gap:28px; min-height:30px; padding:10px 24px; position:relative; overflow:hidden; flex:0 0 auto;
  border-bottom:1px solid rgba(27,82,120,.5); background:
    radial-gradient(150% 220% at 10% -30%, rgba(14,80,144,.5) 0%, rgba(10,38,64,.32) 45%, rgba(6,22,38,.2) 100%),
    linear-gradient(115deg, rgba(11,34,56,.5) 0%, rgba(8,26,44,.5) 40%, rgba(10,52,88,.55) 68%, rgba(9,103,181,.5) 100%);
  box-shadow:inset 0 1px rgba(27,99,140,.28), 0 14px 35px rgba(0,0,0,.4); z-index:2; }
.topbar::before { content:""; position:absolute; left:0; top:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent 0%, rgba(0,229,255,.45) 50%, transparent 100%); }
.topbar:after { content:""; position:absolute; left:0; bottom:0; width:36%; height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent); animation:scan 3s linear infinite; }
.brand { display:flex; align-items:center; gap:16px; letter-spacing:1px; }
.brand-logo { height:40px; width:130px;  display:block; filter:drop-shadow(0 0 18px rgba(0,229,255,.42)); }
h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:3px;
  background:linear-gradient(90deg,#ffffff 0%, #d9f4ff 55%, #8fdcff 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; }
.sub { color:var(--muted); font-size:10px; margin-top:4px; letter-spacing:4px; }
.tabs { margin-left:auto; display:flex; gap:12px; }
.tab { position:relative; overflow:hidden; border:1px solid rgba(27,74,112,.8); color:#cfe8f5;
  background:linear-gradient(180deg, rgba(14,47,80,.68), rgba(10,33,56,.55) 55%, rgba(7,24,41,.55));
  padding:10px 26px 12px; cursor:pointer; font:inherit; font-size:14px; letter-spacing:2px;
  text-shadow:0 0 10px rgba(0,229,255,.4); transition:.25s; border-radius:3px; }
.tab::before { content:""; position:absolute; left:0; right:0; top:0; height:10px; pointer-events:none;
  background:linear-gradient(180deg,rgba(20,110,175,.42),rgba(120,200,250,.62) 30%,rgba(250,255,255,.78) 52%,rgba(140,215,250,.62) 70%,rgba(30,120,185,.28)); }
.tab:hover { color:#fff; border-color:rgba(0,229,255,.6); box-shadow:0 0 18px rgba(0,229,255,.5); transform:translateY(-1px); }
.tab.active { background:linear-gradient(180deg, rgba(19,67,107,.88), rgba(13,42,72,.72) 55%, rgba(10,31,56,.72));
  border-color:rgba(0,229,255,.9); color:#fff;
  box-shadow:inset 0 0 0 1px rgba(0,229,255,.4), 0 0 16px rgba(0,229,255,.55); }
.stage { flex:1 1 auto; min-height:0; position:relative; background:#030a14; overflow:hidden; }
.stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
.loading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  color:var(--muted); letter-spacing:2px; background:#030a14; z-index:3; transition:opacity .4s; }
.loading.hide { opacity:0; pointer-events:none; }
.spinner { width:18px; height:18px; border:2px solid #1a4c70; border-top-color:var(--cyan); border-radius:50%; animation:spin 1s linear infinite; }
.loading .hint { font-size:12px; color:#5d7f95; letter-spacing:1px; }
@keyframes scan { from{transform:translateX(-130%)} to{transform:translateX(360%)} }
@keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>

    <button class="tab" data-i="1">智慧工地</button>
    <button class="tab" data-i="2">智慧制造</button>
  </nav>
</header>
<main class="stage">
  <div class="loading" id="loading"><div class="spinner"></div><span>正在加载…</span><span class="hint">请保持网络连接（界面来自云端发布链接）</span></div>
  <iframe id="twinFrame" src="https://www.frontop.cloud/cloud/shareScreen/6bcdb818-9719-40cb-aed1-28336-4a80240c26a5fec3422113e6e581a8a2-96e0a1f09106" title="数字工厂大屏" allowfullscreen></iframe>
</main>
<script>
  const LINKS = ["https://www.frontop.cloud/cloud/shareScreen/6bcdb818-9719-40cb-aed1-28336-4a80240c26a5fec3422113e6e581a8a2-96e0a1f09106", "https://www.frontop.cloud/cloud/shareScreen/dcd11bcf-1e05-4b70-8078-28338-4a80240c26a5fec3422113e6e581a8a2-9e2dcc3822af", "https://www.frontop.cloud/cloud/shareScreen/2267e311-72ce-46bf-b38c-28339-4a80240c26a5fec3422113e6e581a8a2-d05e00b5679a"];
  const frame = document.getElementById('twinFrame');
  const loading = document.getElementById('loading');
  const tabs = [...document.querySelectorAll('.tab')];
  const base = location.href.split('?')[0];

  // 当前窗口是哪个界面：?tab=N 决定，无参数默认界面一
  function currentTab() {
    const m = /[?&]tab=(\d+)/.exec(location.search);
    const i = m ? parseInt(m[1], 10) : 0;
    return (i >= 0 && i < LINKS.length) ? i : 0;
  }
  const SCREEN = currentTab();
  window.name = 'factory-screen-' + SCREEN;   // 本窗口命名，供其他窗口跳回

  function activate(i) {
    tabs.forEach((t, j) => t.classList.toggle('active', j === i));
    if (frame.getAttribute('src') !== LINKS[i]) {
      loading.classList.remove('hide');
      frame.src = LINKS[i];
    }
  }
  frame.addEventListener('load', () => { loading.classList.add('hide'); });
  setTimeout(() => loading.classList.add('hide'), 15000);

  // 点其他标签：找同名窗口 → 有则切过去（不新建）；没有才开新窗口
  tabs.forEach((t, i) => t.addEventListener('click', () => {
    if (i === SCREEN) return;
    const win = window.open('', 'factory-screen-' + i);
    if (win && win.location.href !== 'about:blank') {
      win.focus();                                        // 已开过 → 直接跳回
    } else if (win) {
      win.location.href = (i === 0 ? base : base + '?tab=' + i);   // 没开过 → 打开对应界面
    }
  }));

  activate(SCREEN);
</script>
</body>
</html>
